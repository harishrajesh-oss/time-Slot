<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timetable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4a6fa5;
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f2f6fb;
        }

        tr:hover {
            background-color: #e3ecf7;
        }

        .no-data {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Class Timetable</h1>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time Slot</th>
                <th>Subject</th>
                <th>Faculty Name</th>
                <th>Classroom</th>
            </tr>
        </thead>
        <tbody>
            {% for slot in slots %}
            <tr>
                <td>{{ slot.day }}</td>
                <td>{{ slot.start_time|time:"h:i A" }} - {{ slot.end_time|time:"h:i A" }}</td>
                <td>{{ slot.subject_name }}</td>
                <td>{{ slot.faculty_name }}</td>
                <td>{{ slot.classroom }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="no-data">No timetable records available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
